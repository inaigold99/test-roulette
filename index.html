<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사다리 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>사다리 게임 (최대 7명)</h2>
  <section>
    <label>
      참가자 수 (1~7):
      <input type="number" id="playerCount" min="1" max="7" value="3">
    </label>
    <button onclick="setupFields()">참가자 이름/상품 입력</button>
  </section>
  <form id="ladderForm" style="display:none;">
    <h3>시작지점 이름 입력</h3>
    <div id="startNames"></div>
    <h3>끝지점 상품 입력</h3>
    <div id="endNames"></div>
    <button type="button" onclick="startLadderGame()">Start!</button>
  </form>
  <div id="ladderContainer"></div>
  <div id="results"></div>
  <script src="script.js"></script>
</body>
</html>
